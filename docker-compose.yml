services:
  db:
    image: postgres:16-alpine
    container_name: eseller-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eseller
      POSTGRES_PASSWORD: eseller
      POSTGRES_DB: eseller
    ports:
      - "5432:5432"
    volumes:
      - eseller_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eseller -d eseller"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: eseller-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://eseller:eseller@db:5432/eseller?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-production}
      AUTH_URL: http://localhost:3000
      SHIPPING_FEE: "5.00"
      TAX_RATE: "0.08"
    volumes:
      - eseller_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  eseller_pgdata:
  eseller_uploads:
